<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
</head>

<body>

    <nav>
        <a href="#home">Home</a> |
        <a href="#pictures">Pictures</a> |
        <a href="#video">Video</a> |
        <a href="#contact">Contact</a>
    </nav>

    <hr>

    <section id="home">
        <h1>Home</h1>
        <p>Welcome to my website!</p>
    </section>

    <section id="pictures">
        <h2>Pictures</h2>
        <img src="picture1.jpg" width="200" onclick="openLightbox(this.src)">
        <img src="picture2.jpg" width="200" onclick="openLightbox(this.src)">
    </section>

    <section id="video">
        <h2>Video</h2>
        
<video width="560" hight="315" controls>
            <source src="video.mp4" type="video/mp4">
            
        </video>

    </section>

    <section id="contact">
        <h2>Contact</h2>

        <form>
            <label>Name:</label>
            <input type="text" name="name">

            <br><br>

            <label>Email:</label>
            <input type="email" name="email">

            <br><br>

            <label>Message:</label>
            <textarea name="message"></textarea>

            <br><br>

            <input type="submit" value="Send">
        </form>
    </section>

    <hr>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>
    <div id="lightbox" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(0,0,0,0.8); justify-content:center; align-items:center;">
        <img id="lightbox-img" src="" style="max-width:90%; max-height:90%;">
 </div>

    <script>
        function openLightbox(src) {
            document.getElementById('lightbox').style.display = 'flex';
            document.getElementById('lightbox-img').src = src;
        }

        document.getElementById('lightbox').addEventListener('click', function() {
            this.style.display = 'none';
        });
    </script>       

</body>
</html>
