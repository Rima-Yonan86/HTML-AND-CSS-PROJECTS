<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
</head>

<body>

    <nav>
        <a href="#home">Home</a> |
        <a href="#pictures">Pictures</a> |
        <a href="#video">Video</a> |
        <a href="#contact">Contact</a>
    </nav>

    <hr>

    <section id="home">
        <h1>Home</h1>
        <p>Welcome to my website!</p>
    </section>

    <section id="pictures">
        <h2>Pictures</h2>
        <img src="picture1.jpg" alt="Picture 1" width="200">
        <img src="picture2.jpg" alt="Picture 2" width="200">
    </section>

    <section id="video">
        <h2>Video</h2>
        <video width="400" controls>
            <source src="video.mp4" type="video/mp4">
        </video>
    </section>

    <section id="contact">
        <h2>Contact</h2>

        <form>
            <label>Name:</label>
            <input type="text" name="name">

            <br><br>

            <label>Email:</label>
            <input type="email" name="email">

            <br><br>

            <label>Message:</label>
            <textarea name="message"></textarea>

            <br><br>

            <input type="submit" value="Send">
        </form>
    </section>

    <hr>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>
</html>
